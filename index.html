<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduProjects - Talaba Portali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="pb-24">
  <header class="sticky top-0 z-40 glass-card px-4 py-4 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">EduProjects</h1>
        <p class="text-[11px] text-indigo-400 font-medium">Tayyor ishlar & Veb-saytlar</p>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-5">
    <!-- Qidiruv -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
      <input type="text" id="searchInput" oninput="renderProjects()" placeholder="Loyiha yoki fan nomini kiriting..." 
             class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
    </div>

    <!-- Kategoriya Filter -->
    <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none" id="categoryFilters">
      <button onclick="setCategory('all', this)" class="cat-pill px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-md">Barchasi</button>
      <button onclick="setCategory('Mustaqil ish', this)" class="cat-pill px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-400">Mustaqil ish</button>
      <button onclick="setCategory('Veb-sayt', this)" class="cat-pill px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-400">Veb-saytlar</button>
      <button onclick="setCategory('Kurs ishi', this)" class="cat-pill px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-400">Kurs ishi</button>
    </div>

    <!-- Zakaz Berish Banneri -->
    <div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/30 p-4 rounded-2xl flex justify-between items-center">
      <div>
        <h3 class="text-xs font-bold text-white mb-0.5">Kerakli mavzu yo'qmi?</h3>
        <p class="text-[10px] text-indigo-300">Shaxsiy zakaz bering, tezda tayyorlaymiz!</p>
      </div>
      <button onclick="openOrderModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-md transition">
        <i class="fa-solid fa-pen-to-square mr-1"></i> Buyurtma berish
      </button>
    </div>

    <!-- Loyihalar Ro'yxati -->
    <div id="projectsList" class="space-y-4">
      <div class="text-center py-12 text-slate-500 text-xs">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
        <p>Loyihalar yuklanmoqda...</p>
      </div>
    </div>
  </main>

  <!-- Buyurtma Modali -->
  <div id="orderModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 relative border border-slate-700">
      <button onclick="closeOrderModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-base font-bold text-white mb-1"><i class="fa-solid fa-pen-nib text-indigo-400 mr-2"></i> Yangi Buyurtma Berish</h3>
      <p class="text-xs text-slate-400 mb-4">Mavzuni qoldiring, admin siz bilan bog'lanadi</p>
      <form onsubmit="submitOrder(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] text-slate-300 font-medium mb-1">Ism Familiyangiz:</label>
          <input type="text" id="orderStudentName" required placeholder="Masalan: Ali Valiyev" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] text-slate-300 font-medium mb-1">Telegram / Telefon raqam:</label>
          <input type="text" id="orderStudentContact" required placeholder="@username yoki +99890..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] text-slate-300 font-medium mb-1">Fan va Mavzu nomi:</label>
          <textarea id="orderTopic" rows="3" required placeholder="Mavzu va hajm haqida yozing..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"></textarea>
        </div>
        <button type="submit" id="orderSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-2xl text-xs transition shadow-lg shadow-indigo-600/30">
          Buyurtmani Yuborish
        </button>
      </form>
    </div>
  </div>

  <!-- To'lov Modali -->
  <div id="paymentModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 relative border border-slate-700 max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-base font-bold text-white mb-1" id="modalTitle">Loyiha Nomi</h3>
      <p class="text-xs text-slate-400 mb-4">Kartaga pul o'tkazing va chek skrinshotini yuboring</p>
      
      <div id="cardsContainer" class="space-y-2 mb-4"></div>
      
      <div class="bg-indigo-950/40 border border-indigo-500/20 p-3 rounded-2xl mb-4 text-center">
        <div class="text-[10px] text-slate-400 uppercase">To'lov Summasi:</div>
        <div class="text-indigo-400 font-extrabold text-lg" id="modalPrice">0 UZS</div>
      </div>

      <form onsubmit="submitPayment(event)" class="space-y-3">
        <input type="hidden" id="modalProjectId">
        <div>
          <label class="block text-[11px] text-slate-300 font-medium mb-1">Ismingiz:</label>
          <input type="text" id="studentName" required placeholder="Ali Valiyev" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] text-slate-300 font-medium mb-1">Telegram yoki Telefon:</label>
          <input type="text" id="studentContact" required placeholder="@username yoki +99890..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] text-slate-300 font-medium mb-1">To'lov Cheki (Rasm):</label>
          <input type="file" id="receiptImg" accept="image/*" required onchange="encodeImageFileAsURL(this)" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white">
        </div>
        <button type="submit" id="submitBtn" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-2xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30">
          <i class="fa-solid fa-paper-plane"></i> Chekni Yuborish
        </button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMmB0tW-JGizWSOdlFJJd68p6sksrlS_8",
      authDomain: "mustaqil-ish-63c2c.firebaseapp.com",
      projectId: "mustaqil-ish-63c2c",
      databaseURL: "https://mustaqil-ish-63c2c-default-rtdb.firebaseio.com",
      storageBucket: "mustaqil-ish-63c2c.firebasestorage.app",
      messagingSenderId: "577427329404",
      appId: "1:577427329404:web:e3ac004474ff1c9d5454f9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allProjects = [];
    let allPurchases = [];
    let adminCards = [];
    let selectedCategory = 'all';
    let base64Receipt = '';

    function getDeviceId() {
      let devId = localStorage.getItem('app_device_id');
      if (!devId) {
        devId = 'dev_' + Math.random().toString(36).substring(2, 11);
        localStorage.setItem('app_device_id', devId);
      }
      return devId;
    }

    db.ref("projects").on("value", snapshot => {
      const data = snapshot.val();
      allProjects = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      renderProjects();
    });

    db.ref("purchases").on("value", snapshot => {
      const data = snapshot.val();
      allPurchases = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      renderProjects();
    });

    db.ref("settings/cards").on("value", snapshot => {
      const data = snapshot.val();
      adminCards = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
    });

    function setCategory(cat, btn) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('bg-slate-900', 'text-slate-400');
      });
      btn.classList.remove('bg-slate-900', 'text-slate-400');
      btn.classList.add('bg-indigo-600', 'text-white');
      renderProjects();
    }

    function renderProjects() {
      const list = document.getElementById('projectsList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const myDeviceId = getDeviceId();
      list.innerHTML = '';

      const filtered = allProjects.filter(p => {
        const matchesCat = selectedCategory === 'all' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(search) || (p.description && p.description.toLowerCase().includes(search));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">Mos keladigan loyihalar topilmadi.</div>`;
        return;
      }

      filtered.forEach(p => {
        const myPurchase = allPurchases.find(req => req.projectId === p.id && req.deviceId === myDeviceId);
        let statusTag = '', actionBtn = '';

        if (!myPurchase) {
          actionBtn = `<button onclick="openPayment('${p.id}', '${p.title.replace(/'/g, "\\'")}', ${p.price})" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2"><i class="fa-solid fa-cart-shopping"></i> Sotib olish (${Number(p.price).toLocaleString()} UZS)</button>`;
        } else if (myPurchase.status === 'pending') {
          statusTag = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md text-[10px] font-semibold">Kutilmoqda</span>`;
          actionBtn = `<button disabled class="w-full bg-slate-800 text-amber-400/90 font-medium py-2.5 rounded-xl text-xs border border-amber-500/20">⏳ Admin tekshirmoqda...</button>`;
        } else if (myPurchase.status === 'approved') {
          statusTag = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md text-[10px] font-semibold">Tasdiqlangan</span>`;
          actionBtn = `<a href="${p.fileData}" download="${p.fileName || 'loyiha'}" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30"><i class="fa-solid fa-download"></i> Faylni Yuklab Olish</a>`;
        }

        list.innerHTML += `
          <div class="glass-card p-5 rounded-2xl relative">
            <div class="flex justify-between items-center mb-2">
              <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-md">${p.category || 'Loyiha'}</span>
              ${statusTag}
            </div>
            <h3 class="text-sm font-bold text-white mb-1">${p.title}</h3>
            <p class="text-xs text-slate-400 mb-4 leading-relaxed">${p.description || ''}</p>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-bold text-slate-200">${Number(p.price).toLocaleString()} UZS</span>
            </div>
            ${actionBtn}
          </div>
        `;
      });
    }

    function openOrderModal() { document.getElementById('orderModal').classList.remove('hidden'); }
    function closeOrderModal() { document.getElementById('orderModal').classList.add('hidden'); }

    function submitOrder(e) {
      e.preventDefault();
      const btn = document.getElementById('orderSubmitBtn');
      btn.disabled = true;
      btn.innerText = "Yuborilmoqda...";
      db.ref("orders").push().set({
        studentName: document.getElementById('orderStudentName').value,
        studentContact: document.getElementById('orderStudentContact').value,
        topic: document.getElementById('orderTopic').value,
        status: 'pending',
        createdAt: Date.now()
      }).then(() => {
        alert("Buyurtmangiz yuborildi! Admin siz bilan bog'lanadi.");
        closeOrderModal();
        e.target.reset();
        btn.disabled = false;
        btn.innerText = "Buyurtmani Yuborish";
      });
    }

    function encodeImageFileAsURL(element) {
      let file = element.files[0];
      let reader = new FileReader();
      reader.onloadend = function() { base64Receipt = reader.result; }
      reader.readAsDataURL(file);
    }

    function openPayment(id, title, price) {
      document.getElementById('modalProjectId').value = id;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalPrice').innerText = Number(price).toLocaleString() + " UZS";
      
      const cContainer = document.getElementById('cardsContainer');
      cContainer.innerHTML = '';
      if(adminCards.length === 0) {
        cContainer.innerHTML = `<div class="text-xs text-rose-400 text-center">Admin hali karta qo'shmagan!</div>`;
      } else {
        adminCards.forEach(c => {
          cContainer.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
              <div>
                <div class="font-mono font-bold text-white tracking-wider">${c.number}</div>
                <div class="text-[10px] text-slate-400">${c.holder} (${c.bank})</div>
              </div>
              <button type="button" onclick="navigator.clipboard.writeText('${c.number}'); alert('Karta nusxalandi!')" class="bg-indigo-600 px-2.5 py-1 rounded-lg text-white"><i class="fa-regular fa-copy"></i> Nusxa</button>
            </div>
          `;
        });
      }
      document.getElementById('paymentModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('paymentModal').classList.add('hidden'); }

    function submitPayment(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Yuborilmoqda...";

      db.ref("purchases").push().set({
        projectId: document.getElementById('modalProjectId').value,
        studentName: document.getElementById('studentName').value,
        studentContact: document.getElementById('studentContact').value,
        receiptImage: base64Receipt,
        deviceId: getDeviceId(),
        status: 'pending',
        createdAt: Date.now()
      }).then(() => {
        alert("To'lov cheki yuborildi! Admin tasdiqlashi bilan faylni yuklab olish ochiladi.");
        closeModal();
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Chekni Yuborish`;
      });
    }
  </script>
</body>
</html>
