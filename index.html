<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduProjects - Professional Akademik Ekotizim</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#070a13">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; transition: background-color 0.2s, color 0.2s; }
    .dark body { background-color: #070a13; color: #f8fafc; }
    .light body { background-color: #f1f5f9; color: #0f172a; }
    .glass-card { backdrop-filter: blur(12px); }
    .dark .glass-card { background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.08); }
    .light .glass-card { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(0, 0, 0, 0.08); }
  </style>
</head>
<body class="pb-24">

  <!-- GLOBAL E'LON -->
  <div id="globalAnnouncement" class="hidden bg-gradient-to-r from-amber-600 to-orange-600 text-white px-4 py-2.5 text-xs font-semibold text-center shadow-lg relative z-50 flex items-center justify-center gap-2">
    <i class="fa-solid fa-bullhorn"></i>
    <span id="announcementTextContent"></span>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-40 glass-card px-4 py-3.5 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div>
        <h1 class="text-base font-bold dark:text-white text-slate-800 leading-tight">EduProjects PRO</h1>
        <p class="text-[10px] text-indigo-400 font-medium">Universitet Akademik Ekotizim</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-800 text-amber-400 border border-slate-700 text-xs"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      <button onclick="toggleCabinet()" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5">
        <i class="fa-solid fa-user text-indigo-400"></i> Kabinetim
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 space-y-6">
    
    <!-- TAYYOR ISHLAR VA LOYIHALAR -->
    <div class="space-y-4">
      <h2 class="text-xs font-bold dark:text-white text-slate-800 uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-folder-open text-indigo-400"></i> Barcha Tayyor Ishlar va Loyihalar
      </h2>
      
      <div class="space-y-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="renderProjects()" placeholder="Loyiha nomini kiriting..." 
                 class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
        </div>
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
          <button onclick="filterCategory('Barchasi')" id="cat_Barchasi" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition">Barchasi</button>
          <button onclick="filterCategory('Mustaqil ish')" id="cat_Mustaqil_ish" class="bg-slate-900 border border-slate-800 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition">Mustaqil ish</button>
          <button onclick="filterCategory('Veb-sayt')" id="cat_Veb_sayt" class="bg-slate-900 border border-slate-800 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition">Veb-sayt</button>
          <button onclick="filterCategory('Kurs ishi')" id="cat_Kurs_ishi" class="bg-slate-900 border border-slate-800 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition">Kurs ishi</button>
        </div>
      </div>

      <div id="projectsList" class="space-y-3">
        <div class="text-center py-8 text-slate-500 text-xs">Barcha loyihalar yuklanmoqda...</div>
      </div>
    </div>
  </main>

  <!-- KABINET MODAL -->
  <div id="cabinetModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 relative border border-slate-700/60 max-h-[85vh] overflow-y-auto space-y-4">
      <button onclick="toggleCabinet()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
      <div class="flex items-center space-x-3 border-b border-slate-800 pb-4">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl font-bold border border-indigo-500/30">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-white">Mening Kabinetim</h3>
          <p class="text-[10px] text-indigo-400">Shaxsiy xaridlar va yuklamalar</p>
        </div>
      </div>
      <div>
        <h4 class="text-xs font-bold text-indigo-300 mb-2 uppercase tracking-wider">Tasdiqlangan va Kutilayotgan Ishlarim</h4>
        <div id="myPurchasesList" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </div>

  <!-- TO'LOV MODAL -->
  <div id="paymentModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 relative border border-slate-700/60 max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 class="text-base font-bold text-white mb-1" id="paymentModalTitle">To'lov qilish</h3>
      <p class="text-xs text-slate-400 mb-4">Kartaga pul o'tkazing va chek rasmini yuklang</p>
      <div id="cardsContainer" class="space-y-2 mb-4"></div>
      <div class="bg-indigo-950/40 border border-indigo-500/20 p-3 rounded-2xl mb-4 text-center">
        <div class="text-[10px] text-slate-400 uppercase">Summa:</div>
        <div class="text-indigo-400 font-extrabold text-lg" id="modalPrice">0 UZS</div>
      </div>
      <form onsubmit="submitPayment(event)" class="space-y-3">
        <input type="hidden" id="modalProjectId">
        <input type="text" id="studentName" required placeholder="Ism Familiyangiz" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
        <input type="text" id="studentContact" required placeholder="Telefon raqamingiz" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
        <input type="number" id="paidAmount" required placeholder="O'tkazilgan summa" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
        <input type="file" id="receiptImg" accept="image/*" required onchange="compressAndEncodeReceipt(this)" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-indigo-600 file:text-white cursor-pointer">
        <div id="receiptStatus" class="text-[10px] text-slate-400 mt-1"></div>
        <button type="submit" id="paySubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition">Chekni Yuborish</button>
      </form>
    </div>
  </div>

  <script>
    function getDeviceId() {
      let devId = localStorage.getItem('app_device_id');
      if (!devId) {
        devId = 'dev_' + Math.random().toString(36).substring(2, 11);
        localStorage.setItem('app_device_id', devId);
      }
      return devId;
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('saved_student_name')) document.getElementById('studentName').value = localStorage.getItem('saved_student_name');
      if (localStorage.getItem('saved_student_contact')) document.getElementById('studentContact').value = localStorage.getItem('saved_student_contact');
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDMmB0tW-JGizWSOdlFJJd68p6sksrlS_8",
      authDomain: "mustaqil-ish-63c2c.firebaseapp.com",
      projectId: "mustaqil-ish-63c2c",
      databaseURL: "https://mustaqil-ish-63c2c-default-rtdb.firebaseio.com",
      storageBucket: "mustaqil-ish-63c2c.firebasestorage.app",
      messagingSenderId: "577427329404",
      appId: "1:577427329404:web:e3ac004474ff1c9d5454f9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("settings/announcement").on("value", snap => {
      const banner = document.getElementById('globalAnnouncement');
      if (snap.val()) {
        document.getElementById('announcementTextContent').innerText = snap.val();
        banner.classList.remove('hidden');
      } else { banner.classList.add('hidden'); }
    });

    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark'); html.classList.add('light');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
      } else {
        html.classList.remove('light'); html.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-moon';
      }
    }

    let allProjects = [];
    let myPurchases = [];
    let adminCards = [];
    let base64Receipt = '';
    let currentCategory = 'Barchasi';

    function filterCategory(cat) {
      currentCategory = cat;
      ['Barchasi', 'Mustaqil ish', 'Veb-sayt', 'Kurs ishi'].forEach(c => {
        const btn = document.getElementById('cat_' + c.replace(/\s+/g, '_'));
        if (btn) btn.className = (c === cat) ? "bg-indigo-600 text-white px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition" : "bg-slate-900 border border-slate-800 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition";
      });
      renderProjects();
    }

    // BARCHA LOYIHALARNI BAZADAN TO'LIQ TORTIB OLISH
    db.ref("projects").on("value", snapshot => {
      const data = snapshot.val();
      allProjects = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      renderProjects();
      renderCabinet();
    });

    const myDeviceId = getDeviceId();
    db.ref("purchases").orderByChild("deviceId").equalTo(myDeviceId).on("value", snapshot => {
      const data = snapshot.val();
      myPurchases = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      renderProjects();
      renderCabinet();
    });

    db.ref("settings/cards").on("value", snapshot => {
      const data = snapshot.val();
      adminCards = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
    });

    function toggleCabinet() { document.getElementById('cabinetModal').classList.toggle('hidden'); }

    function renderProjects() {
      const list = document.getElementById('projectsList');
      if (!list) return;
      const search = (document.getElementById('searchInput').value || '').toLowerCase();
      
      if (allProjects.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Hozircha loyihalar mavjud emas. Admin panelga loyiha qo'shing.</div>`;
        return;
      }

      const filtered = allProjects.filter(p => {
        const matchesSearch = (p.title || '').toLowerCase().includes(search);
        const matchesCat = (currentCategory === 'Barchasi' || p.category === currentCategory);
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Qidiruv bo'yicha loyihalar topilmadi.</div>`;
        return;
      }

      let html = '';
      filtered.forEach(p => {
        const myPurchase = myPurchases.find(req => req.projectId === p.id);
        let statusTag = '', actionBtn = '';
        const priceFormatted = Number(p.price || 0).toLocaleString();
        const fileSource = p.fileData || p.fileUrl || '#';

        if (!myPurchase) {
          actionBtn = `<button onclick="openPayment('${p.id}', '${(p.title || '').replace(/'/g, "\\'")}', ${p.price})" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2"><i class="fa-solid fa-cart-shopping"></i> Sotib olish (${priceFormatted} UZS)</button>`;
        } else if (myPurchase.status === 'pending') {
          statusTag = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md text-[10px] font-semibold">Kutilmoqda</span>`;
          actionBtn = `<button disabled class="w-full bg-slate-800 text-amber-400 font-medium py-2.5 rounded-xl text-xs border border-amber-500/20">⏳ Admin tekshirmoqda...</button>`;
        } else if (myPurchase.status === 'approved') {
          statusTag = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md text-[10px] font-semibold">Tasdiqlangan</span>`;
          actionBtn = `<a href="${fileSource}" download="${p.fileName || 'loyiha'}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> Faylni Yuklab Olish</a>`;
        }

        html += `
          <div class="glass-card p-4 rounded-2xl relative space-y-2 border border-slate-800">
            <div class="flex justify-between items-center">
              <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-md">${p.category || 'Loyiha'}</span>
              ${statusTag}
            </div>
            <h3 class="text-xs font-bold dark:text-white text-slate-800">${p.title}</h3>
            <p class="text-[11px] text-slate-400">${p.description || ''}</p>
            <div class="text-xs font-bold text-slate-200">Narxi: <span class="text-indigo-400">${priceFormatted} UZS</span></div>
            ${actionBtn}
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function renderCabinet() {
      const container = document.getElementById('myPurchasesList');
      if (!container) return;
      container.innerHTML = myPurchases.length ? '' : `<div class="text-[11px] text-slate-500 italic py-2">Sizda hozircha xaridlar yo'q</div>`;
      myPurchases.forEach(req => {
        const p = allProjects.find(item => item.id === req.projectId) || { title: 'Loyiha' };
        let badge = req.status === 'approved' ? `<span class="text-emerald-400 font-bold">Tasdiqlangan</span>` : `<span class="text-amber-400">Tekshirilmoqda</span>`;
        container.innerHTML += `<div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs flex justify-between items-center"><span class="truncate max-w-[170px] text-white font-medium">${p.title}</span>${badge}</div>`;
      });
    }

    function openPayment(id, title, price) {
      document.getElementById('modalProjectId').value = id;
      document.getElementById('paymentModalTitle').innerText = title;
      document.getElementById('modalPrice').innerText = Number(price).toLocaleString() + " UZS";
      document.getElementById('paidAmount').value = price;
      
      const cContainer = document.getElementById('cardsContainer');
      cContainer.innerHTML = '';
      if (adminCards.length === 0) cContainer.innerHTML = `<div class="text-xs text-amber-400 text-center py-1">Admin karta qo'shmagan</div>`;
      adminCards.forEach(c => {
        cContainer.innerHTML += `<div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex justify-between text-xs font-mono mb-2 text-white"><span>${c.number}</span><span class="text-slate-400">(${c.holder})</span></div>`;
      });
      document.getElementById('paymentModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('paymentModal').classList.add('hidden'); }
    
    function compressAndEncodeReceipt(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX = 700;
          canvas.width = img.width > MAX ? MAX : img.width;
          canvas.height = img.width > MAX ? img.height * (MAX / img.width) : img.height;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          base64Receipt = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('receiptStatus').innerHTML = `<span class="text-emerald-400 font-bold">Rasm tayyor!</span>`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitPayment(e) {
      e.preventDefault();
      if (!base64Receipt) { alert("Chek rasmini yuklang!"); return; }
      const sName = document.getElementById('studentName').value.trim();
      const sContact = document.getElementById('studentContact').value.trim();
      localStorage.setItem('saved_student_name', sName);
      localStorage.setItem('saved_student_contact', sContact);

      const btn = document.getElementById('paySubmitBtn');
      btn.disabled = true; btn.innerText = "Yuborilmoqda...";

      db.ref("purchases").push().set({
        projectId: document.getElementById('modalProjectId').value,
        studentName: sName,
        studentContact: sContact,
        paidAmount: Number(document.getElementById('paidAmount').value),
        receiptImage: base64Receipt,
        deviceId: getDeviceId(),
        status: 'pending',
        createdAt: Date.now()
      }).then(() => {
        alert("Chek yuborildi!");
        closeModal();
        base64Receipt = '';
        document.getElementById('receiptImg').value = '';
        document.getElementById('receiptStatus').innerText = '';
      }).finally(() => { btn.disabled = false; btn.innerText = "Chekni Yuborish"; });
    }
  </script>
</body>
</html>
