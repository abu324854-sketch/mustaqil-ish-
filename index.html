<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talaba Portali - SocialGraph & AI Prezentatsiya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://socialgraph-demo-default-rtdb.firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db; window.dbRef = ref; window.dbOnValue = onValue;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-40 border-b border-slate-800/80 px-6 py-3.5 flex items-center justify-between shadow-2xl">
        <div class="flex items-center space-x-3">
            <div class="p-2.5 bg-cyan-600 rounded-xl text-white">
                <i data-lucide="graduation-cap" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg leading-tight text-white">TALABA PORTALI</h1>
                <p class="text-xs text-slate-400 font-medium">Graf algoritmlari & AI Prezentatsiya xizmati</p>
            </div>
        </div>

        <div class="flex space-x-2 bg-slate-900 p-1 rounded-xl">
            <button id="btn-tab-graph" onclick="switchTab('graph')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-cyan-600 text-white">Graf Analizator</button>
            <button id="btn-tab-ai" onclick="switchTab('ai')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400">AI Prezentatsiya</button>
        </div>
    </header>

    <!-- TAB 1: GRAF ANALIZATOR -->
    <main id="tab-graph" class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1700px] mx-auto w-full">
        <aside class="lg:col-span-3 space-y-5">
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400">Eng Qisqa Yo'lni Topish</h3>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Boshlang'ich Foydalanuvchi:</label>
                    <select id="start-node" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"></select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Mo'ljallangan Foydalanuvchi:</label>
                    <select id="end-node" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"></select>
                </div>
                <button onclick="runDijkstra()" class="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2.5 rounded-xl text-xs text-white">
                    Optimal Yo'lni Hisoblash
                </button>
            </div>
        </aside>

        <section class="lg:col-span-9 flex flex-col">
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex-1 flex flex-col min-h-[500px] relative">
                <div class="flex-1 relative w-full h-full min-h-[450px] bg-slate-950/60 rounded-xl overflow-hidden border border-slate-900" id="canvas-container">
                    <canvas id="graphCanvas" class="w-full h-full block"></canvas>
                </div>
            </div>
        </section>
    </main>

    <!-- TAB 2: AI PREZENTATSIYA -->
    <main id="tab-ai" class="hidden flex-1 p-6 max-w-4xl mx-auto w-full space-y-6">
        <div class="glass-panel p-6 rounded-3xl border border-slate-800 space-y-5">
            <h2 class="text-xl font-bold text-center text-white">AI Yordamida Prezentatsiya Yaratish</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-900 p-4 rounded-2xl">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mavzu:</label>
                    <input type="text" id="pres-topic" placeholder="Mavzuni kiriting..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tarif (Admin Belgilagan):</label>
                    <select id="pres-plan" onchange="updatePriceDisplay()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        <option value="p1">Standart (5 Slayd)</option>
                        <option value="p2" selected>Optimal (8 Slayd)</option>
                        <option value="p3">Premium Pro (12 Slayd)</option>
                    </select>
                </div>
            </div>

            <div class="p-4 bg-slate-900 rounded-2xl flex justify-between items-center">
                <span class="text-xs text-slate-400">To'lov Summasi:</span>
                <span id="final-price-tag" class="text-lg font-extrabold text-cyan-400">50,000 so'm</span>
            </div>
            <button onclick="paySuccess()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-3 rounded-xl text-xs">
                To'lov Qilish va Yuklab Olish
            </button>
        </div>
    </main>

    <script>
        let nodes = [], edges = [], activePath = [];
        let prices = { plan1: "30000", plan2: "50000", plan3: "80000" };
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            resizeCanvas();
            setTimeout(initFirebaseSync, 1000);
        });

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            if (container) { canvas.width = container.clientWidth; canvas.height = container.clientHeight; drawGraph(); }
        }

        function initFirebaseSync() {
            if (!window.db) return;
            // Graph Data Realtime Sync
            window.dbOnValue(window.dbRef(window.db, 'graphData'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    nodes = data.nodes || [];
                    edges = data.edges || [];
                    updateSelectDropdowns();
                    drawGraph();
                }
            });

            // Prices Realtime Sync
            window.dbOnValue(window.dbRef(window.db, 'prices'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    prices = data;
                    updatePriceDisplay();
                }
            });
        }

        function updateSelectDropdowns() {
            const startSelect = document.getElementById('start-node');
            const endSelect = document.getElementById('end-node');
            startSelect.innerHTML = ''; endSelect.innerHTML = '';
            nodes.forEach(n => {
                startSelect.add(new Option(`${n.name} (#${n.id})`, n.id));
                endSelect.add(new Option(`${n.name} (#${n.id})`, n.id));
            });
            if (nodes.length > 1) endSelect.selectedIndex = nodes.length - 1;
        }

        function updatePriceDisplay() {
            const val = document.getElementById('pres-plan').value;
            let price = prices.plan2;
            if (val === 'p1') price = prices.plan1;
            if (val === 'p3') price = prices.plan3;
            document.getElementById('final-price-tag').innerText = parseInt(price).toLocaleString('uz-UZ') + " so'm";
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            edges.forEach(edge => {
                const u = nodes.find(n => n.id === edge.from), v = nodes.find(n => n.id === edge.to);
                if (!u || !v) return;
                const isInPath = isEdgeInPath(edge.from, edge.to);

                ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(v.x, v.y);
                ctx.strokeStyle = isInPath ? '#06b6d4' : 'rgba(71, 85, 105, 0.6)';
                ctx.lineWidth = isInPath ? 4 : 2; ctx.stroke();

                const midX = (u.x + v.x) / 2, midY = (u.y + v.y) / 2;
                ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(midX, midY, 10, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = isInPath ? '#38bdf8' : '#cbd5e1'; ctx.font = '600 11px "Plus Jakarta Sans"';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(edge.weight, midX, midY);
            });

            nodes.forEach(node => {
                const isInPath = activePath.includes(node.id);
                ctx.beginPath(); ctx.arc(node.x, node.y, 22, 0, 2 * Math.PI);
                ctx.fillStyle = isInPath ? '#0284c7' : '#1e293b'; ctx.fill();
                ctx.lineWidth = isInPath ? 3 : 2; ctx.strokeStyle = isInPath ? '#38bdf8' : '#475569'; ctx.stroke();
                ctx.fillStyle = '#ffffff'; ctx.font = '600 11px "Plus Jakarta Sans"';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(node.name, node.x, node.y);
            });
        }

        function isEdgeInPath(u, v) {
            for (let i = 0; i < activePath.length - 1; i++) {
                if ((activePath[i] === u && activePath[i+1] === v) || (activePath[i] === v && activePath[i+1] === u)) return true;
            }
            return false;
        }

        function runDijkstra() {
            const startId = parseInt(document.getElementById('start-node').value, 10);
            const endId = parseInt(document.getElementById('end-node').value, 10);
            if (!startId || !endId || startId === endId) return;

            const dist = {}, prev = {};
            nodes.forEach(n => { dist[n.id] = Infinity; prev[n.id] = null; });
            dist[startId] = 0;
            let unvisited = [...nodes];

            while (unvisited.length > 0) {
                unvisited.sort((a, b) => dist[a.id] - dist[b.id]);
                const u = unvisited.shift();
                if (dist[u.id] === Infinity) break;
                edges.filter(e => e.from === u.id || e.to === u.id).forEach(edge => {
                    const neighborId = (edge.from === u.id) ? edge.to : edge.from;
                    const alt = dist[u.id] + edge.weight;
                    if (alt < dist[neighborId]) { dist[neighborId] = alt; prev[neighborId] = u.id; }
                });
            }
            const path = []; let curr = endId;
            if (dist[curr] !== Infinity) { while (curr !== null) { path.unshift(curr); curr = prev[curr]; } }
            activePath = path; drawGraph();
        }

        function switchTab(t) {
            document.getElementById('tab-graph').classList.toggle('hidden', t !== 'graph');
            document.getElementById('tab-ai').classList.toggle('hidden', t !== 'ai');
            document.getElementById('btn-tab-graph').className = t === 'graph' ? 'px-4 py-1.5 rounded-lg text-xs font-bold bg-cyan-600 text-white' : 'px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400';
            document.getElementById('btn-tab-ai').className = t === 'ai' ? 'px-4 py-1.5 rounded-lg text-xs font-bold bg-cyan-600 text-white' : 'px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400';
        }

        function paySuccess() { alert("To'lov muvaffaqiyatli! Prezentatsiya yuklanmoqda..."); }
    </script>
</body>
</html>
